set -g allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

set-option -g status-position bottom
# set -g status-right '#H'

set -s escape-time 0
set -g base-index 1

# set-window-option -g mode-keys vi

bind -r h previous-window
bind -r l next-window

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

bind -r ^ last-window
bind -r K select-pane -U
bind -r J select-pane -D
bind -r H select-pane -L
bind -r L select-pane -R

bind-key -r -T prefix       C-k           resize-pane -U
bind-key -r -T prefix       C-j           resize-pane -D
bind-key -r -T prefix       C-h           resize-pane -L
bind-key -r -T prefix       C-l          resize-pane -R

# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
#
# set -g @continuum-boot 'on'
# set -g @continuum-boot-options 'foot'
# set -g @resurrect-strategy-nvim 'session'

bind-key -r f run-shell "tmux neww ~/.config/scripts/tmux-sessionizer"
set-option -g update-environment "WAYLAND_DISPLAY DISPLAY SWAYSOCK XDG_RUNTIME_DIR"


set -g status-style "bg=default fg=#e6d5c2"
set -g status-justify left
set -g status-left-length 200

set -g status-left "#[fg=#ea9875,bold] #{session_name}  "
set -g status-right "#[fg=#73665b]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD) "

set -g window-status-format "#[fg=#73665b]#{window_index}:#{window_name}#{window_flags} "
set -g window-status-current-format "#[fg=#ea9875,bold]#{window_index}:#{window_name}#{window_flags} "
set -g window-status-last-style "fg=#a09384"
set -g window-status-activity-style "fg=#f4a21c"

set -g pane-border-style "fg=#362f2c"
set -g pane-active-border-style "fg=#ea9875"

set -g message-style "bg=#2a2422 fg=#e6d5c2"
set -g message-command-style "bg=#2a2422 fg=#e6d5c2"

set -g mode-style "bg=#2f1e17 fg=#e6d5c2"

# run '~/.tmux/plugins/tpm/tpm'
